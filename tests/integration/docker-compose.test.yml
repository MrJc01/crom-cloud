# Docker Compose para Testes de Integração
# Uso: docker-compose -f tests/integration/docker-compose.test.yml up -d

version: "3.8"

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: crom-cloud-test-db
    environment:
      POSTGRES_USER: crom_test
      POSTGRES_PASSWORD: crom_test_pass
      POSTGRES_DB: crom_cloud_test
    ports:
      - "5433:5432"  # Porta diferente para não conflitar com dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crom_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: crom-cloud-test-redis
    ports:
      - "6380:6379"  # Porta diferente para não conflitar com dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
