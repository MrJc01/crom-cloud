# ══════════════════════════════════════════════════════
# Crom Cloud Monitor — Perfis de Ambiente
# ══════════════════════════════════════════════════════
# Cada perfil define como o sistema deve rodar.
# Use: monitor.sh --profile=<nome>

# ── LOCALHOST (Desenvolvimento) ──────────────────────
[localhost]
MODE=dev
COMPOSE_SERVICES="postgres redis"
API_RUN_CMD="go run ./cmd/crom-cloud"
API_CWD=core
ENV_FILE=../.env
PORT=8080
DATABASE_HOST=localhost
REDIS_HOST=localhost
BUILD_BEFORE_RUN=0
DOCKER_COMPOSE_FILE=../docker-compose.yml

# ── PRODUCTION (Docker Compose Full) ────────────────
[production]
MODE=prod
COMPOSE_SERVICES="postgres redis core"
API_RUN_CMD=""
API_CWD=.
ENV_FILE=.env
PORT=8080
DATABASE_HOST=postgres
REDIS_HOST=redis
BUILD_BEFORE_RUN=1
DOCKER_COMPOSE_FILE=docker-compose.yml

# ── STAGING (Docker + Hot Reload) ────────────────────
[staging]
MODE=staging
COMPOSE_SERVICES="postgres redis"
API_RUN_CMD="go run ./cmd/crom-cloud"
API_CWD=core
ENV_FILE=../.env
PORT=8081
DATABASE_HOST=localhost
REDIS_HOST=localhost
BUILD_BEFORE_RUN=0
DOCKER_COMPOSE_FILE=../docker-compose.yml
