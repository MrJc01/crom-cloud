# ══════════════════════════════════════════════════════
# Crom Cloud Monitor — Configurações Padrão
# ══════════════════════════════════════════════════════

# Intervalo de refresh do status (segundos)
MONITOR_REFRESH_INTERVAL=5

# Timeout para health checks (segundos)
HEALTH_CHECK_TIMEOUT=5

# Número de tentativas para health check
HEALTH_CHECK_RETRIES=10

# Intervalo entre tentativas (segundos)
HEALTH_CHECK_INTERVAL=2

# Porta padrão da API
DEFAULT_PORT=8080

# Quantidade de linhas de log para exibir
LOG_TAIL_LINES=50

# Modo verbose (0=off, 1=on)
VERBOSE=0

# Auto-restart em caso de crash (0=off, 1=on)
AUTO_RESTART=0

# Habilitar notificação sonora (0=off, 1=on)
BELL_ON_ERROR=1
