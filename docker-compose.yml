version: "3.8"

services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crom-cloud-core
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://crom:crom_dev_2026@postgres:5432/crom_cloud?sslmode=disable"
      REDIS_URL: "redis:6379"
      VAULT_KEY: "${VAULT_KEY}"
      JWT_SECRET: "${JWT_SECRET}"
      PLUGINS_DIR: "./plugins"
      MIGRATIONS_DIR: "./migrations"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crom-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: crom-cloud-db
    environment:
      POSTGRES_USER: crom
      POSTGRES_PASSWORD: crom_dev_2026
      POSTGRES_DB: crom_cloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crom"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crom-net

  redis:
    image: redis:7-alpine
    container_name: crom-cloud-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crom-net

networks:
  crom-net:
    driver: bridge

volumes:
  pgdata:
